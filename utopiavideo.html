<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utopia Videos</title>
    <style>
        /* 1. Base Setup */
        body {
            margin: 0;
            padding: 0;
            background-image: url('mars-gruen.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* Keeps background still while scrolling */
            font-family: sans-serif;
            min-height: 100vh;
        }

        
        /* 2. Fixed Heading Style */
         .ueber {
            position: relative;       /* Locks the heading at the top */
            top: 20px;
            left: 50%;             /* Moves the left edge to the middle of the screen */
            transform: translateX(-50%); /* Shifts it back by half its own width for perfect centering */
            z-index: 100;          /* Keeps it on top of scrolling videos */
            margin: 0;
            text-align: center;    /* Centers text lines inside the wrapper */
            width: 100%;           /* Ensures alignment works across screen sizes */
        }

        .ueber h1 {
            color: tomato;
            font-size: 60px;       
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6); /* Makes text readable over background */
        }

        /* 3. Video Container Layout */
        .video-container {
            display: flex;
            flex-direction: column; /* Stacks videos vertically */
            align-items: center;    /* Centers videos horizontally */
            gap: 40px;              /* Space between the videos */
            padding-top: 120px;     /* Push videos down so they start below heading */
            padding-bottom: 60px;   /* Safe space at the very bottom */
            width: 100%;
            box-sizing: border-box;
        }

        /* 4. Single Video Styling */
        video {
            width: 90%;
            max-width: 600px;       /* Limits max width for desktop view */
            height: auto;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            display: block;
            background-color: #000; /* Black frame during loading */
        }


        /* Der Zurück-Button (Nutzt das Mars-Rostrot) */
        .back-btn {
            display: block;
            text-align: center;
            background-color: #bc4626;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 18px rgba(188, 70, 38, 0.3);
            margin-top: 30px;
        }

        /* Button-Effekt beim Drüberfahren (Wechselt zu Cyber-Cyan) */
        .back-btn:hover {
            background-color: #00cbd6;
            box-shadow: 0 6px 18px rgba(0, 203, 214, 0.4);
            transform: translateY(-2px);
        }

        .back-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <!-- Heading wrapper -->
    <div class="ueber">
        <h1>Utopia Projekt Videos</h1>
    </div>

    <!-- Centered video list -->
    <div class="video-container">
<div class="ueber">
        <h1>Support Utopia</h1></div>
        <video controls poster="vorschaubild.jpg">
            <source src="astro.mp4" type="video/mp4">
        </video> <div class="ueber">
         <h1>Water for the Mars</h1></div>
        <video controls poster="vorschaubild.jpg">
            <source src="wasser.mp4" type="video/mp4">
        </video> <div class="ueber">
        <h1>Mars Base  </h1></div>
        <video controls poster="vorschaubild.jpg">
            <source src="marsbase.mp4" type="video/mp4">
        </video> <div class="ueber">
            <h1>Green Mars</h1></div>

        <video controls poster="vorschaubild.jpg">
            <source src="green1.mp4" type="video/mp4">
        </video></video> <div class="ueber">
          <h1>Mars goes green</h1></div>
        <video controls poster="vorschaubild.jpg">
            <source src="marsgoesgreen.mp4" type="video/mp4">
        </video>


         <!-- Der Zurück-Button führt direkt zur index.html -->
        <a href="index.html" class="back-btn">
            ← Zurück zur Hauptseite
        </a>
    </div>

</body>
</html>
