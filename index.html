<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utopia-Projekt</title>
    <style>
        /* Grundlegendes Seiten-Setup */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-image: url('mars-hintergrund.jpg'); /* Dein Mars-Bild */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* Der Haupt-Container (Die Spenden-Karte) */
       .card {
    background: rgba(234, 186, 161, 0.88); /* Heller Mars-Himmel-Ton */
    backdrop-filter: blur(6px);
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(80, 35, 20, 0.2); 
    max-width: 450px;
    width: 100%;
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.3);
}

        /* Hauptüberschrift (H1) */
        h1 {
            font-size: 26px;
            color: #33160c; /* Tiefes Fels-Dunkelbraun */
            margin-bottom: 12px;
            font-weight: 800;
        }

        /* Beschreibungstext (P) */
        p {
            font-size: 16px;
            color: #5c4a43; /* Angenehmes, dunkles Staub-Braun */
            margin-bottom: 30px;
        }

        /* Der Spenden-Button */
        .donate-btn {
            display: inline-block;
            background-color: #bc4626; /* Kräftiges Mars-Rostrot */
            color: white;
            text-decoration: none;
            padding: 14px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 18px rgba(188, 70, 38, 0.3);
        }

        /* Button-Effekt beim Drüberfahren (Hover) */
        .donate-btn:hover {
            background-color: #00cbd6; /* Wechselt zu Cyber-Cyan */
            box-shadow: 0 6px 18px rgba(0, 203, 214, 0.4);
            transform: translateY(-2px);
        }

        /* Button-Effekt beim Anklicken (Active) */
        .donate-btn:active {
            transform: translateY(1px);
        }

        /* Der Info-Link unter dem Button */
        .info-link {
            display: inline-block;
            margin-top: 22px;
            color: #5c4a43; /* Gleiches Braun wie der Fließtext */
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            border-bottom: 1px dashed #bc4626; /* Gestrichelte rostrote Linie */
            padding-bottom: 2px;
        }

        /* Info-Link-Effekt beim Drüberfahren */
        .info-link:hover {
            color: #bc4626; /* Wird rostroten */
            border-bottom-style: solid; /* Linie wird durchgezogen */
        }

        /* Fußzeile für rechtliche Hinweise (Footer) */
        .footer {
            margin-top: 40px;
            font-size: 11px;
            color: #8c766f; /* Unauffälliges Hellbraun */
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Hier kannst du den Titel anpassen -->
        <h1>Unterstütze die entstehung des Utopia-Projekts</h1>
        
        <!-- Hier kommt deine Beschreibung hin -->
        <p>
            Mit einer spende unterstützt du das Utopia Projekt das  Game  das denn Mars grün und bewohnbar macht!
        </p>

        <!-- ACHTUNG: Ersetze den Link unten mit deinem PayPal.Me-Link! -->
        <a href="https://paypal.me/gizmo6981744" target="_blank" class="donate-btn">
            Jetzt via PayPal spenden
        </a>
        

        <!-- HIER IST DEIN NEUER INFO-LINK -->
        <br>
        <a href="info.html" class="info-link">
            Mehr über das Projekt erfahren →
        </a>

        
    

        <div class="footer">
            <p>Privatgeschenk/Schenkung. Keine Spendenbescheinigung möglich.</p>
        </div>
    </div>

</body>
</html>
